<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:236px;flex:none;align-self:stretch;height:100%;min-height:100%;background:#17140F;display:flex;flex-direction:column;padding:20px 14px;box-sizing:border-box;gap:26px">
  <div style="display:flex;align-items:center;gap:10px;padding:0 8px">
    <div style="width:26px;height:26px;border-radius:8px;background:var(--accent,#127A5E);display:flex;align-items:center;justify-content:center;font:700 12px 'Plus Jakarta Sans',sans-serif;color:#fff">A</div>
    <div style="display:flex;flex-direction:column;gap:1px">
      <div style="font:600 13px/1 'Plus Jakarta Sans',sans-serif;color:#F6F3EF;letter-spacing:-.01em">Atlas Console</div>
      <div style="font:400 9.5px/1 'IBM Plex Mono',monospace;color:#6E665C;letter-spacing:.06em">V 2.4 · PROD</div>
    </div>
  </div>

  <nav style="display:flex;flex-direction:column;gap:2px">
    <div style="font:500 9.5px/1 'IBM Plex Mono',monospace;color:#5E574E;letter-spacing:.12em;padding:0 8px 8px">WORKSPACE</div>
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
      <a href="#" style="display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;text-decoration:none;transition:background .18s ease,color .18s ease;background:{{ it.bg }}" style-hover="background:rgba(255,255,255,.06)" data-active="{{ it.active }}" data-nav="{{ it.label }}">
        <span style="width:15px;height:15px;flex:none;border-radius:5px;border:1.5px solid currentColor;opacity:.55;background:{{ it.iconFill }}"></span>
        <span style="flex:1;font:500 12.5px/1 'Plus Jakarta Sans',sans-serif;color:{{ it.color }}">{{ it.label }}</span>
        <span style="font:500 9.5px/1 'IBM Plex Mono',monospace;color:{{ it.badgeColor }};background:{{ it.badgeBg }};padding:3px 5px;border-radius:5px">{{ it.badge }}</span>
      </a>
    </sc-for>
  </nav>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:12px">
    <div style="padding:12px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <span style="font:500 10px/1 'IBM Plex Mono',monospace;color:#8B8278;letter-spacing:.08em">SYNC QUEUE</span>
        <span style="font:600 10px/1 'IBM Plex Mono',monospace;color:#F6F3EF">82%</span>
      </div>
      <div style="height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden">
        <div style="height:100%;width:82%;border-radius:99px;background:var(--accent,#127A5E);animation:barGrow 1.1s cubic-bezier(.2,.8,.2,1) both"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;transition:background .18s ease" style-hover="background:rgba(255,255,255,.06)" data-signout="1">
      <div style="width:26px;height:26px;border-radius:99px;background:#2E2822;display:flex;align-items:center;justify-content:center;font:600 10.5px 'IBM Plex Mono',monospace;color:#C9C1B6">AD</div>
      <div style="flex:1;min-width:0">
        <div style="font:500 11.5px/1.2 'Plus Jakarta Sans',sans-serif;color:#EFEAE4">admin</div>
        <div style="font:400 9.5px/1.3 'IBM Plex Mono',monospace;color:#6E665C">Superuser</div>
      </div>
      <span style="width:5px;height:5px;border-radius:99px;background:#14A06E"></span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:236,&quot;height&quot;:720},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "Dashboard";
    const defs = [
      ["Dashboard", ""], ["Customers", ""], ["Inventory", ""], ["Suppliers", ""],
      ["Expenses", ""], ["Sales", ""], ["Submit Bill", ""], ["My Bills", ""],
      ["Review Bills", "1"], ["Reports", ""], ["Settings", ""]
    ];
    return {
      items: defs.map(([label, badge]) => {
        const on = label === active;
        return {
          label, badge,
          active: on ? "true" : "false",
          bg: on ? "rgba(255,255,255,.08)" : "transparent",
          color: on ? "#FBF8F5" : "#9C948A",
          iconFill: on ? "var(--accent,#127A5E)" : "transparent",
          badgeColor: badge ? (on ? "#FBF8F5" : "#9C948A") : "transparent",
          badgeBg: badge ? "rgba(255,255,255,.08)" : "transparent"
        };
      })
    };
  }
}
</script>
</body>
</html>
